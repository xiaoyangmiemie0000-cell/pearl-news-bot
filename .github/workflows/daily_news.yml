name: 珍珠珠宝新闻日报

on:
  schedule:
    # 双触发兜底，规避 GitHub Actions cron 高峰期排队延迟
    - cron: '0 23 * * *'   # UTC 23:00 = 北京时间 07:00（首次尝试）
    - cron: '0 0 * * *'    # UTC 00:00 = 北京时间 08:00（兜底）
  workflow_dispatch:       # 支持手动触发

jobs:
  collect-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 运行新闻收集与推送
        env:
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
        run: python pearl_news.py
        continue-on-error: true
        id: run_main

      - name: 首次失败重试
        if: steps.run_main.outcome == 'failure'
        env:
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
        run: |
          echo "首次运行失败，等待 30 秒后重试..."
          sleep 30
          python pearl_news.py
